<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeRates — Closing Card (Mobile 9:16)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #040608;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
  }

  .card {
    width: 390px;
    height: 844px;
    background: #080c12;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 56px 36px 52px;
  }

  /* Ambient glow center */
  .card::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,232,122,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,232,122,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,232,122,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 1;
  }

  /* Corner accents */
  .corner-tr {
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 120px;
    border-top: 1px solid rgba(0,232,122,0.15);
    border-right: 1px solid rgba(0,232,122,0.15);
    pointer-events: none;
    z-index: 2;
  }
  .corner-bl {
    position: absolute;
    bottom: 0; left: 0;
    width: 120px; height: 120px;
    border-bottom: 1px solid rgba(0,232,122,0.15);
    border-left: 1px solid rgba(0,232,122,0.15);
    pointer-events: none;
    z-index: 2;
  }

  /* Top: logo mark */
  .top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 2;
  }

  .mark {
    width: 48px;
    height: 48px;
    opacity: 0.9;
  }

  /* Center: CTA */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 20px;
    z-index: 2;
    flex: 1;
    justify-content: center;
  }

  .tagline {
    font-family: 'Syne', sans-serif;
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    color: #f0f4ff;
    letter-spacing: -0.02em;
  }

  .tagline .green {
    color: #00e87a;
    display: block;
  }

  .accent-bar {
    width: 64px;
    height: 3px;
    background: #00e87a;
    border-radius: 3px;
  }

  .cta-pill {
    background: #00e87a;
    color: #000;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 14px 32px;
    border-radius: 999px;
    text-transform: none;
  }

  .cta-sub {
    font-size: 13px;
    color: rgba(240,244,255,0.4);
    letter-spacing: 0.02em;
  }

  /* Bottom: domain */
  .bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 2;
  }

  .logo {
    height: 28px;
    width: auto;
    opacity: 0.7;
  }

  .url {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #00e87a;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <div class="top">
      <img class="mark" src="https://chat.homerates.ai/assets/homerates-mark.svg" alt="HomeRates" />
    </div>

    <div class="center">
      <h2 class="tagline">
        No forms.<br/>
        No calls.<br/>
        <span class="green">Just answers.</span>
      </h2>
      <div class="accent-bar"></div>
      <div class="cta-pill">Ask it anything →</div>
      <span class="cta-sub">No sign-up required</span>
    </div>

    <div class="bottom">
      <img class="logo" src="https://chat.homerates.ai/assets/homerates-logo-horizontal.png" alt="HomeRates.ai" />
      <span class="url">HomeRates.ai</span>
    </div>
  </div>
</body>
</html>
